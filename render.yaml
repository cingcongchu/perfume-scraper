services:
  - type: web
    name: perfume-scraper-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: sqlite:///./perfumes.db
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src
      sizeGB: 1
